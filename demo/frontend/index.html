<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出差制度智能体 DEMO</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside>
    <div class="brand">
      <h1>规章制度助手</h1>
      <p>分级目录 · 工具召回 · SSE</p>
    </div>
    <div class="meta" id="health">加载知识库…</div>
    <h2>制度文件</h2>
    <ul id="file-list"></ul>
    <label class="upload-btn">
      添加 PDF
      <input type="file" id="pdf-input" accept="application/pdf,.pdf" />
    </label>
    <div class="meta" id="ingest-status"></div>
    <h2>示例问题</h2>
    <ul id="samples"></ul>
    <p class="hint">可上传新的制度 PDF，抽取拆条后立刻用于问答。最终作答为真流式。</p>
  </aside>
  <main>
    <header>
      <strong>对话</strong>
      <span id="status">空闲</span>
    </header>
    <section id="log"></section>
    <form id="form">
      <textarea id="q" rows="2" placeholder="例如：出差津贴怎么算？紧急出差来不及审批怎么办？"></textarea>
      <button type="submit" id="send">发送</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
